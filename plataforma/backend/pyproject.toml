[project]
name = "plataforma-aterrizaje"
version = "1.0.0"
description = "Plataforma de retroalimentación del aterrizaje (UTB)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlmodel>=0.0.22",
  "pyyaml>=6",
  "numpy>=1.26",
  "pandas>=2.2",
  "pyserial>=3.5",
]

[dependency-groups]
dev = ["pytest>=8", "httpx>=0.27"]

[tool.uv]
package = false

[tool.pytest.ini_options]
testpaths = ["tests"]
